<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보안 체험 부스</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#e4f6ff;background:radial-gradient(ellipse at 50% 0%,#0b3052 0%,#030912 62%);word-break:keep-all}
main{max-width:900px;margin:auto;padding:40px 16px}
.tag{color:#42cfff;font-size:12px;letter-spacing:2px;font-weight:800}
h1{font-size:clamp(28px,6vw,44px);margin:10px 0}
p{color:#a9c8d9;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
a{display:block;text-decoration:none;color:#fff;background:#0b2a42;border:1px solid #245777;border-radius:14px;padding:24px 18px;transition:.2s}
a:hover,a:focus-visible{border-color:#3ce1ff;transform:translateY(-3px)}
a b{display:block;color:#4cdbff;font-size:14px;letter-spacing:1px}
a strong{display:block;font-size:21px;margin:10px 0 6px}
a small{color:#9bbdce}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
