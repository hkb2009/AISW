<h1>가짜뉴스, 피싱메일 OX퀴즈</h1><p class="subtitle">OX 문제에 도전해보세요! 세 문제 전부 맞추면 통과입니다 :&gt;</p>
<div id="progress" aria-live="polite">쉬운 문제 · 문제 1 / 3</div><div id="question">인터넷 검색 결과의 맨 위에 표시된 정보는 검색 순위가 높으므로 반드시 사실이라고 볼 수 있다.</div>

<div class="tools"><button id="easyBtn" onclick="setDifficulty('easy')" class="active">쉬운 문제</button><button id="hardBtn" onclick="setDifficulty('hard')" class="">어려운 문제</button><button onclick="nextPlayer()">다음 참가자 →</button></div>
</main><script src="../score-link.js"></script><script>
const DEFAULTS_HARD=[{"q": "최근의 고도화된 가짜뉴스는 공신력 있는 언론사의 로고나 웹사이트 레이아웃을 교묘하게 도용하여 유포된다. (*레이아웃: 창 또는 페이지 내에서 콘텐츠의 크기, 간격, 구성 요소 등의 배치*)", "answer": "O"}, {"q": "다음을 읽고 문제에 알맞은 답을 고르시오. \n확증편향은 개인의 기존 신념이나 가치관에 부합하는 가짜뉴스를 무비판적으로 수용하게 만드는 심리적 요인이다. \n\n 문제: 알고리즘 추천 시스템은 확증편향을 완화한다.", "answer": "X"}, {"q": "다음을 읽고 문제에 알맞은 답을 고르시오.\n'필터 버블(Filter Bubble)'은 이용자들이 인터넷 정보제공자가 제공한 맞춤형 정보를 이용하면서, 필터링된 정보만을 접하게 되는 현상을 지칭한다. \n\n 문제: 필터 버블 현상이 지속되면 이용자는 가짜뉴스에 대한 비판적인 태도가 약화된다.", "answer": "O"}, {"q": "오정보(Misinformation)는 명백한 악의를 가지고 조작된 정보를 의미하며, 허위정보(Disinformation)는 고의적인 기만 의도 없이 잘못된 정보가 전파되는 것을 의미한다.", "answer": "X"}, {"q": "다음 자료를 읽고 문제에 알맞은 답을 고르시오.\n[자료] 다음은 사용자 C가 메일로 수신한 접속 링크와 실제 공식 웹사이트의 URL을 비교한 결과이다.\n\n공식 웹사이트 URL: [https://www.mybank.com] (https://www.mybank.com), 접속 시 주소창에 보안 주소의 상징인 자물쇠 아이콘(HTTPS)이 표시된다.\n사용자 C가 메일로 수신한 접속 링크: [http://www.mybarnk.com/login] (http://www.mybarnk.com/login), 접속 시 주소창에 보안 주소의 상징인 자물쇠 아이콘(HTTPS)이 표시되지 않는다.\n \n문제: 사용자 C가 메일로 수신한 접속 링크는 공식 웹사이트의 URL이다.", "answer": "X"}, {"q": "가짜뉴스 대응을 위해 공적 기관에서 모든 허위 정보를 일괄적으로 사전 검열하고 차단하는 제도는 표현의 자유를 보호하면서도 공익을 달성할 수 있는 가장 이상적이고 민주적인 해결책으로 평가받는다.", "answer": "X"}, {"q": "웹사이트 주소가 https://로 시작하고 주소창에 자물쇠 표시가 있다면 해당 사이트는 피싱 사이트가 아니라고 확신할 수 있다.", "answer": "X"}, {"q": "다음 자료를 읽고 문제에 알맞은 답을 고르시오.\n[자료] 다음은 A씨가 받은 메시지이다. \n[국외발신] 교통민원24: 미확인 청구가 있습니다. 공식 페이지에서 해당 내역을 확인해 주세요: https://sw.ron/TF43D\nA씨는 메시지 속 사이트에 접속하였고, 교통 법규 위반으로 인한 과태료를 물어야 한다는 요구를 받았다.\n(단, A씨는 운전 면허가 없으며 본인 명의의 자동차를 소유하고 있지 않고, 운전을 단 한번도 한 적이 없다.)\n\n문제: A씨는 실제로 과태료를 지불하지 않아도 된다.", "answer": "O"}, {"q": "의심스러운 메일의 첨부파일을 실행했지만 개인정보를 입력하지 않은 경우에도 피싱으로 인한 피해를 입을 수 있다.", "answer": "O"}, {"q": "다음 자료를 읽고 문제에 알맞은 답을 고르시오.\n[자료] 여러 사이트에서 같은 비밀번호를 사용하고 있다면, 한 계정의 정보가 노출되었을 때 다른 계정도 위험해질 수 있다. 따라서 노출된 비밀번호를 다른 서비스에서도 사용했다면 관련 계정들의 보안 상태도 확인할 필요가 있다.\n\n문제: 피싱 사이트에 평소 사용하는 비밀번호를 입력했다면 해당 사이트와 관련된 계정의 비밀번호만 변경하면 충분하다.", "answer": "X"}, {"q": "WHO는 '인포데믹(Infodemic)'을 사람들이 의도적으로 퍼뜨린 거짓 정보만을 의미한다고 정의했다.", "answer": "X"}, {"q": "미국 연방거래위원회(FTC)는 실제 피싱 사례를 소개하면서, 사기 이메일이 익숙한 기업의 로고를 사용하더라도 가짜일 수 있다고 설명했다.", "answer": "O"}, {"q": "미국 법무부는 2016년 미국 대선 관련 해킹 사건에서 스피어피싱을 통해 계정 정보와 이메일 등을 탈취한 정황을 발표했다.", "answer": "O"}, {"q": "2016년 미국 대선을 앞두고 프란치스코 교황이 도널드 트럼프 후보를 공식 지지한다고 발표했다는 보도가 사실로 확인됐다.", "answer": "X"}, {"q": "NASA는 2017년 11월 지구가 15일 동안 완전히 어두워질 것이라고 공식 발표했다.", "answer": "X"}, {"q": "2022년 우크라이나에서 젤렌스키 대통령이 항복을 선언하는 딥페이크 영상이 유포됐으며, 우크라이나 방송에도 등장하였다.", "answer": "O"}, {"q": "2020년 WHO와 여러 국제기구는 코로나19 관련 허위·오해 정보의 확산 문제를 다루는 공동 성명을 발표했다.", "answer": "O"}, {"q": "도널드 트럼프가 1998년 잡지 인터뷰에서 특정 정당의 유권자들을 비하하는 발언을 했다는 글이 퍼졌으며, 해당 발언은 실제 잡지 인터뷰에서 확인됐다.", "answer": "X"}, {"q": "2021년 온라인에서 카멀라 해리스가 참전용사 지원을 축소하고 관련 기관을 폐쇄하겠다고 말했다는 주장이 퍼졌으며, 해당 발언은 실제 발언 기록에서 확인됐다.", "answer": "X"}, {"q": "2016년, 버락 오바마 전 미국 대통령 부부가 두바이에 고급 별장을 구매한다는 소식이 온라인에서 퍼졌으며, 실제로 해당 주택을 구매한 것으로 확인됐다.", "answer": "X"}, {"q": "어떤 주장이 100개의 웹사이트에 게시되었다. 조사 결과, 95개 사이트는 최초 게시물의 내용을 출처 확인 없이 재인용했다. 나머지 5개 사이트는 독립적으로 자료를 검토했다고 밝혔지만, 그중 2개 사이트는 동일한 원자료를 활용했다.\n\n따라서 웹사이트 100곳에 게시되었다는 사실만으로 해당 주장이 100개의 독립적인 근거를 확보했다고 판단할 수 없다.", "answer": "O"}, {"q": "한 AI 판별기는 시험 데이터에서 정확도 99%를 기록했다. 그러나 시험 데이터와 실제 학교에서 판별하려는 게시물의 허위정보 비율이 서로 다르다.\n\n이 경우에도 실제 학교 게시물에서 허위정보를 판별할 확률이 정확히 99%라고 결론 내릴 수 있다.", "answer": "X"}, {"q": "한 게시물은 특정 정책 시행 이후 범죄 건수가 20% 감소했다는 통계를 제시하며 정책의 효과를 주장한다. 하지만 같은 기간 다른 지역에서도 범죄가 감소했는지, 범죄 신고 기준이 바뀌었는지, 다른 요인이 영향을 미쳤는지는 제시하지 않았다.\n\n감소율이라는 수치가 정확하더라도, 그 수치만으로 정책이 범죄 감소의 직접적인 원인이라고 확정할 수는 없다", "answer": "O"}, {"q": "한 정치 관련 게시물에 조작된 사진이 포함된 것으로 확인되었다. 그러나 게시물에는 사진과 별개로 통계 자료와 정책 관련 주장도 함께 제시되어 있다.\n\n사진이 조작되었다는 사실은 해당 게시물에 포함된 모든 통계와 정책 관련 주장까지 거짓임을 논리적으로 증명한다.", "answer": "X"}, {"q": "정부 기관의 공식 보고서에서 인용한 수치라면, 해당 보고서의 조사 대상과 측정 방식이 게시물의 주장과 일치하는지 확인하지 않아도 그 수치를 근거로 결론을 내려도 된다.", "answer": "X"}, {"q": "한 기업의 이메일에 대한 SPF·DKIM·DMARC 인증이 모두 통과했고, 발신 도메인도 기업의 공식 도메인과 일치한다. 그러나 해당 기업 직원의 이메일 계정이 공격자에게 탈취되었을 가능성은 확인되지 않았다.\n\n이메일 인증 결과가 정상이라는 사실만으로 메일의 작성자와 요청 내용까지 정당하다고 판단할 수 있다.", "answer": "X"}, {"q": "실제 서비스의 로그인 화면과 정상적인 앱 권한 승인 화면을 이용한 피싱 사례가 발견되었다. 사용자가 로그인한 뒤 외부 앱에 이메일과 연락처 접근 권한을 승인하도록 유도하는 방식이다.\n\n로그인 화면과 권한 승인 화면이 정상적으로 표시된다면, 사용자가 승인한 앱 역시 해당 서비스가 직접 제공하는 공식 앱이라고 판단할 수 있다.", "answer": "X"}, {"q": "한 동영상 제작자가 협업 제안 이메일의 첨부파일을 실행한 뒤 계정에서 의심스러운 활동이 발생했다. 공격자가 로그인 세션을 탈취했을 가능성이 제기되었다.\n\n이때 비밀번호만 변경하면 기존에 탈취된 로그인 세션도 반드시 무효화되므로, 추가적인 보안 조치는 필요하지 않다.", "answer": "X"}, {"q": "어떤 계정은 비밀번호와 별도의 인증 수단을 모두 요구한다. 공격자가 비밀번호만 알고 있고, 추가 인증을 통과하거나 복구 절차를 악용하거나 기존 로그인 세션을 탈취할 수 없다는 조건이 주어졌다.\n\n이 조건에서는 공격자가 비밀번호만으로 해당 계정에 로그인할 수 없다고 판단할 수 있다.", "answer": "O"}, {"q": "회사 대표의 목소리와 매우 유사한 음성으로 긴급 송금을 지시하는 전화가 왔다. 평소 말투와 목소리가 거의 일치하므로, 별도의 확인 절차 없이 대표 본인이 직접 요청했다고 판단해도 된다.", "answer": "X"}];

}, {"q": "인터넷에서 유명인이 한 말이라며 게시물이 퍼지고 있다. 하지만 그 사람의 공식 계정이나 믿을 만한 뉴스에서는 해당 발언을 찾을 수 없다. 다른 곳에서도 사실인지 확인해 보는 것이 좋다.", "answer": "O"}, {"q": "어떤 영상의 조회수가 매우 높고 댓글에도 많은 사람이 사실이라고 적었다. 조회수와 댓글이 많다는 이유만으로 영상의 내용이 사실이라고 판단할 수 있다.", "answer": "X"}, {"q": "인터넷에서 특정 음식을 먹으면 모든 병을 예방할 수 있다는 글을 발견했다. 글에 믿을 만한 근거나 전문가의 설명이 없다면, 내용을 바로 믿기보다 다른 자료를 확인해야 한다.", "answer": "O"}, {"q": "친구가 문서 링크를 보내 주었다. 링크를 눌렀더니 비밀번호를 입력하라는 화면이 나타났다. 친구가 보낸 링크라도 이상한 점이 있다면 바로 비밀번호를 입력하지 않고 먼저 확인해야 한다.", "answer": "O"}, {"q": "유명한 회사에서 무료 선물을 준다는 이메일을 받았다. 이메일에 회사 로고가 있고 선물을 받으려면 개인정보를 입력하라고 한다. 회사의 공식 홈페이지에서 이벤트를 확인한 뒤 참여하는 것이 안전하다.", "answer": "O"}, {"q": "회사 대표의 이름으로 돈을 빨리 보내 달라는 이메일을 받았다. 대표의 이름이 적혀 있으므로 다른 사람에게 확인하지 않고 바로 돈을 보내도 된다.", "answer": "X"}, {"q": "택배 배송 안내 이메일에 모르는 파일이 첨부되어 있다. 파일을 열어 보라는 설명이 있더라도, 보낸 사람이 확실하지 않다면 파일을 열지 않고 먼저 확인해야 한다.", "answer": "O"}, {"q": "여러 사이트에서 같은 비밀번호를 사용하다가 한 사이트의 비밀번호가 유출되었다는 안내를 받았다. 다른 사이트에서도 같은 비밀번호를 사용한다면 함께 위험해질 수 있으므로 비밀번호를 바꾸는 것이 좋다.", "answer": "O"}];
let difficulty='easy',questions=[],selected=[],position=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function bankKey(){return 'ox_quiz_30_v3_'+difficulty}
function defaults(){return difficulty==='easy'?DEFAULTS_EASY:DEFAULTS_HARD}
function valid(a){return Array.isArray(a)&&a.length===30&&a.every(x=>x&&typeof x.q==='string'&&x.q.trim()&&['O','X'].includes(x.answer))}
function loadQuestions(){return defaults().map(x=>({...x}))}
function setDifficulty(level){difficulty=level;questions=loadQuestions();$('easyBtn').classList.toggle('active',level==='easy');$('hardBtn').classList.toggle('active',level==='hard');start()}
function start(){selected=Array.from({length:30},(_,i)=>i);for(let i=29;i>0;i--){let j=Math.floor(Math.random()*(i+1));[selected[i],selected[j]]=[selected[j],selected[i]]}selected=selected.slice(0,3);position=0;score=0;showQuestion()}
function showQuestion(){answered=false;$('progress').textContent=(difficulty==='easy'?'쉬운 문제':'어려운 문제')+' · 문제 '+(position+1)+' / 3';$('question').textContent=questions[selected[position]].q;$('question').scrollTop=0;$('answers').classList.remove('hidden');document.querySelectorAll('.answers button').forEach(b=>b.disabled=false);$('result').textContent='';$('result').className='result';$('next').classList.add('hidden')}
function finish(passed){
 answered=true;position=3;
 if(window.ScoreLink)ScoreLink.record('ox',score*100); // 점수 연동
 $('progress').textContent=passed?'3문제 모두 정답 · 통과!':'도전 종료';
 $('question').textContent=passed?'🎉 통과입니다!':'아쉽네요. . . 다음 기회에.';
 $('question').scrollTop=0;
 $('answers').classList.add('hidden');
 $('result').textContent=passed?'3문제를 모두 맞혔습니다!':'';
 $('result').className='result '+(passed?'ok':'bad');
 $('next').classList.add('hidden');
}
function answer(v){
 if(answered||position>=3)return;
 answered=true;
 const ok=v===questions[selected[position]].answer;
 document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);
 if(!ok){finish(false);return;}
 score++;
 $('result').textContent='⭕ 정답입니다!';
 $('result').className='result ok';
 $('next').textContent=position===2?'결과 확인 →':'다음 문제 →';
 $('next').classList.remove('hidden');
}
function advance(){
 if(!answered||position>=3)return;
 if(position===2){finish(true);return;}
 position++;showQuestion();
}
function toggleEditor(){let e=$('editor');e.style.display=e.style.display==='block'?'none':'block';if(e.style.display==='block'){renderEditors();$('message').textContent='';e.scrollIntoView({behavior:'smooth',block:'start'})}}
function renderEditors(){let area=$('questionEditors');area.replaceChildren();questions.forEach((item,i)=>{let card=document.createElement('div');card.className='question-card';let label=document.createElement('label');label.textContent=(i+1)+'번 문제';label.htmlFor='question_'+i;let field=document.createElement('textarea');field.id='question_'+i;field.value=item.q;let al=document.createElement('label');al.textContent='정답: ';let sel=document.createElement('select');sel.id='correct_'+i;for(let v of ['O','X']){let o=document.createElement('option');o.value=v;o.textContent=v;sel.append(o)}sel.value=item.answer;al.append(sel);card.append(label,field,al);area.append(card)})}
function edited(){return Array.from({length:30},(_,i)=>({q:$('question_'+i).value.trim(),answer:$('correct_'+i).value}))}
function saveQuestions(){try{let a=edited();if(!valid(a))throw Error('30개 문제의 내용과 정답을 확인해 주세요.');localStorage.setItem(bankKey(),JSON.stringify(a));questions=a;start();$('message').textContent='저장했습니다. 새로운 3문제를 출제했어요.'}catch(e){$('message').textContent='저장 실패: '+e.message}}
function exportQuestions(){let a=edited();if(!valid(a)){$('message').textContent='빈 문제가 있어 백업할 수 없습니다.';return}let blob=new Blob([JSON.stringify(a,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download=(difficulty==='easy'?'쉬운':'어려운')+'_OX_30문제.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importQuestions(){$('importFile').click()}
async function readImport(ev){let f=ev.target.files[0];if(!f)return;try{let a=JSON.parse(await f.text());if(!valid(a))throw Error('정확히 30개의 문제와 O/X 정답이 필요합니다.');questions=a;renderEditors();$('message').textContent='불러왔습니다. 「30문제 저장」을 눌러 적용하세요.'}catch(e){$('message').textContent='불러오기 실패: '+e.message}ev.target.value=''}
function restoreDefaults(){if(!confirm('이 난이도의 저장된 문제를 초기화할까요?'))return;localStorage.removeItem(bankKey());questions=defaults().map(x=>({...x}));renderEditors();start();$('message').textContent='초기화했습니다.'}
document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName))return;let k=e.key.toUpperCase();if(k==='O'||k==='X')answer(k)});
function nextPlayer(){try{localStorage.removeItem('sl_player_v2');}catch(e){}location.reload();} // 다음 참가자: 등록 화면으로
setDifficulty('easy');
</script></body></html>
