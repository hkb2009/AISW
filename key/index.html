<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>열쇠를 얻고 도시를 구하세요!</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#eaf7ff;background:#081322}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193451,#081322 70%);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:28px 18px}header{text-align:center;margin-bottom:24px}.tag{color:#69e2e9;letter-spacing:3px;font-size:12px;font-weight:800}h1{font-size:clamp(26px,5vw,44px);margin:12px 0}p{color:#b5ccdc;line-height:1.7}.panel{border:1px solid #315570;border-radius:20px;padding:26px;background:#102238e8;box-shadow:0 18px 50px #0005}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.choice{border:1px solid #41647c;background:#172d45;border-radius:16px;padding:18px;color:white;cursor:pointer;text-align:left;transition:.2s}.choice:hover,.choice:focus-visible{border-color:#59f0d5;transform:translateY(-3px)}.choice svg{width:100%;height:130px;display:block}.choice b{font-size:19px}.choice small{display:block;color:#a9c8d8;margin-top:7px}.btn{border:0;border-radius:12px;background:#5be5c6;color:#072337;font-weight:800;padding:13px 20px;cursor:pointer;font-size:15px}.btn.secondary{background:#2c4861;color:#eaf7ff}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.hidden{display:none!important}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#bce9f4;margin-bottom:12px}.board{position:relative;max-width:720px;margin:auto;touch-action:none;user-select:none}canvas{display:block;width:100%;height:auto;border:1px solid #34526b;border-radius:14px;background:linear-gradient(#112940,#0b1d30);touch-action:none;cursor:crosshair}.message{text-align:center;min-height:38px;margin:14px 0 0;font-weight:700}.good{color:#6cf1b4}.bad{color:#ff8b9a}.step{font-size:14px;color:#8cb1c6;text-align:center}.result{text-align:center;padding:30px 0}.result h2{font-size:clamp(28px,5vw,42px)}@media(max-width:650px){.choices{grid-template-columns:1fr}.choice svg{height:95px}.panel{padding:15px}}
</style></head><body><div class="wrap"><header><div class="tag">KEY MISSION · SAVE THE CITY</div><h1>🔑 열쇠를 얻고 도시를 구하세요!</h1><p>빛나는 열쇠 도면을 따라 선을 그려 보안 잠금을 해제하세요.</p></header><main class="panel"><section id="select"><div class="tag">CHOOSE YOUR KEY</div><h2>도전할 열쇠를 선택하세요</h2><p>쉬움부터 어려움까지 3단계! 도면을 크게 벗어나면 실패합니다.</p><div class="choices" id="choices"></div></section><section id="play" class="hidden"><div class="stats"><strong id="level"></strong><span id="step"></span><span id="percent">진행률 0%</span></div><div class="step">열쇠의 <b>초록색 시작점</b>부터 시작해 점선을 따라 끝점까지 한 번에 그리세요. 마우스와 터치 모두 가능합니다.</div><div class="board"><canvas id="canvas" width="720" height="470" aria-label="열쇠 도면 따라 그리기"></canvas></div><div class="message" id="message" role="status">초록색 점을 눌러 그리기를 시작하세요.</div><div class="actions"><button class="btn secondary" id="retry">다시 그리기</button><button class="btn secondary" id="back">열쇠 선택</button></div></section><section id="result" class="result hidden"><div style="font-size:72px" id="emoji">🏙️</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="actions"><button class="btn" id="next">다음 단계 →</button><button class="btn secondary" id="resultRetry">다시 도전</button><button class="btn secondary" id="resultHome">열쇠 선택</button></div></section></main></div><script src="../score-link.js"></script><script src="key-mission.js"></script></body></html>
