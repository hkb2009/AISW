<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>열쇠를 얻고 도시를 구하세요!</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#eaf7ff;background:#081322}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193451,#081322 70%);min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:28px 18px}header{text-align:center;margin-bottom:24px}.tag{color:#69e2e9;letter-spacing:3px;font-size:12px;font-weight:800}h1{font-size:clamp(26px,5vw,44px);margin:12px 0}p{color:#b5ccdc;line-height:1.7}.panel{border:1px solid #315570;border-radius:20px;padding:26px;background:#102238e8;box-shadow:0 18px 50px #0005}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.choice{border:1px solid #41647c;background:#172d45;border-radius:16px;padding:18px;color:white;cursor:pointer;text-align:left;transition:.2s}.choice:hover,.choice:focus-visible{border-color:#59f0d5;transform:translateY(-3px)}.choice svg{width:100%;height:130px;display:block}.choice b{font-size:19px}.choice small{display:block;color:#a9c8d8;margin-top:7px}.btn{border:0;border-radius:12px;background:#5be5c6;color:#072337;font-weight:800;padding:13px 20px;cursor:pointer;font-size:15px}.btn.secondary{background:#2c4861;color:#eaf7ff}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.hidden{display:none!important}.stats{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#bce9f4;margin-bottom:12px}.board{position:relative;max-width:720px;margin:auto;touch-action:none;user-select:none}canvas{display:block;width:100%;height:auto;border:1px solid #34526b;border-radius:14px;background:linear-gradient(#112940,#0b1d30);touch-action:none;cursor:crosshair}.progress-track{height:12px;background:#27435b;border-radius:20px;overflow:hidden;margin:15px auto;max-width:720px}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#43caa8,#a3f4ba);transition:width .15s}.message{text-align:center;min-height:38px;margin:14px 0 0;font-weight:700}.good{color:#6cf1b4}.bad{color:#ff8b9a}.step{font-size:14px;color:#8cb1c6;text-align:center}.result{text-align:center;padding:30px 0}.result h2{font-size:clamp(28px,5vw,42px)}@media(max-width:650px){.choices{grid-template-columns:1fr}.choice svg{height:95px}.panel{padding:15px}}
.fail-overlay{position:fixed;inset:0;z-index:1000;background:rgba(2,8,19,.82);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(7px)}.fail-dialog{width:min(440px,100%);text-align:center;background:linear-gradient(145deg,#3b1927,#171e33);border:2px solid #ff647f;border-radius:24px;padding:36px 24px;box-shadow:0 0 0 5px #ff647f22,0 25px 90px #000b;animation:pop .2s ease-out}.fail-symbol{font-size:68px}.fail-dialog h2{color:#ff879a;font-size:clamp(30px,6vw,44px);margin:8px 0}.fail-dialog p{color:#f2d6de}.fail-dialog .btn{background:#ff6f8b;color:#25101a;font-size:19px;padding:16px 32px;width:100%;max-width:290px}@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}

html,body{width:100%;height:100%;overflow:hidden}body{min-height:0}.wrap{height:100dvh;max-width:1200px;padding:clamp(8px,1.4vh,16px);display:flex;flex-direction:column;gap:clamp(5px,1vh,12px)}header{flex:none;margin:0}header h1{font-size:clamp(21px,3.5vh,35px);margin:3px 0}.tag{font-size:11px}.panel{flex:1;min-height:0;display:flex;flex-direction:column;padding:clamp(10px,1.5vh,18px);overflow:hidden}.panel>section:not(.hidden){flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}#play{justify-content:flex-start!important}.stats{margin:0 0 5px}.progress-track{width:100%;margin:5px auto 8px;flex:none}.board{flex:1;min-height:0;width:100%;max-width:none;display:flex;align-items:center;justify-content:center}.board canvas{width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:720/470;object-fit:contain}.actions{margin-top:8px;flex:none}.btn{padding:10px 16px}.choices{margin-top:12px;min-height:0;align-items:stretch}.choice{padding:clamp(8px,1.8vw,18px)}.choice svg{height:clamp(90px,22vh,200px)}#select h2{font-size:clamp(19px,3vh,28px);margin:6px 0}.result{padding:0}.result h2{margin:10px 0}.result p{margin:6px 0}.message{display:none}.fail-dialog{max-height:90dvh;overflow:auto}
@media(max-width:650px){.choices{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.choice b{font-size:12px}.choice small{font-size:10px}.choice svg{height:clamp(60px,14vh,110px)}.choice{padding:7px}.panel{padding:8px}.actions{gap:6px}.btn{font-size:12px;padding:9px 12px}}
#timer{display:inline-block;color:#ffe38a;font-variant-numeric:tabular-nums;font-size:clamp(22px,3.7vh,38px);font-weight:950;letter-spacing:-.5px;text-shadow:0 0 14px #ffd45b55;transform-origin:center;white-space:nowrap}#timer.warning{animation:countdownPulse .9s ease-in-out infinite}#timer.urgent{color:#ff354e;text-shadow:0 0 16px #ff203a99;animation:countdownPulse .43s ease-in-out infinite}@keyframes countdownPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.13);opacity:.65}}.stats{align-items:center;gap:8px}.stats #timer{margin-inline:auto}@media(max-width:600px){#timer{font-size:clamp(20px,3.4vh,30px)}.stats{font-size:12px}}@media(prefers-reduced-motion:reduce){#timer.warning,#timer.urgent{animation:none}}
</style></head><body><div class="wrap"><header><div class="tag">KEY MISSION · SAVE THE CITY</div><h1>🔑 열쇠를 얻고 도시를 구하세요!</h1></header><main class="panel"><section id="select"><div class="tag">CHOOSE YOUR KEY</div><h2>도전할 열쇠를 선택하세요</h2><div class="choices" id="choices"></div></section><section id="play" class="hidden"><div class="stats"><strong id="level"></strong><span id="step"></span><strong id="timer" aria-live="off">⏱ 남은 시간 35초</strong><span id="percent">진행률 0%</span></div><div class="progress-track"><div id="bar" class="progress-bar"></div></div><div class="board"><canvas id="canvas" width="720" height="470" aria-label="열쇠 도면 따라 그리기"></canvas></div><div class="message hidden" id="message" role="status"></div><div class="actions"><button class="btn secondary" id="retry">다시 그리기</button><button class="btn secondary" id="back">열쇠 선택</button></div></section><section id="final" class="result hidden"><div style="font-size:80px">🏙️🎉🔑</div><h2 class="good" id="finalTitle">최종 성공! 도시를 구하셨습니다!</h2><p id="finalDescription">도시를 구했습니다!</p><div class="actions"><button class="btn" id="finalReplay">처음부터 다시 도전</button><button class="btn secondary" id="finalHome">열쇠 선택 화면</button></div></section></main></div><div id="failOverlay" class="fail-overlay hidden" role="alertdialog" aria-modal="true" aria-labelledby="failTitle" aria-describedby="failDesc"><div class="fail-dialog"><div class="fail-symbol">❌</div><h2 id="failTitle">미션 실패!</h2><p id="failDesc">점선을 감싸는 테두리 밖으로 벗어났습니다.<br>다시 그리기에 도전하세요!</p><button class="btn" id="failRetry" type="button">↻ 다시 그리기</button></div></div><script src="../score-link.js"></script><script src="key-mission.js"></script></body></html>
